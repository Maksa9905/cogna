# Override для E2E-тестов.
# Использование: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
#
# Отличия: VITE_API_URL=https://localhost (GraphQL на /graphql)
# Сертификаты: локально и в CI — openssl (см. nginx/certs/README.md)

services:
  frontend:
    environment:
      - VITE_API_URL=https://localhost

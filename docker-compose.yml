version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cogna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cogna
      POSTGRES_PASSWORD: cogna_dev_password
      POSTGRES_DB: cogna
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-auth-db.sql:/docker-entrypoint-initdb.d/init-auth-db.sql:ro
    networks:
      - cogna-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogna -d cogna"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - NestJS
  backend:
    container_name: cogna-backend
    build:
      context: ./cogna.backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./cogna.backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=cogna
      - DATABASE_PASSWORD=cogna_dev_password
      - DATABASE_NAME=cogna
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cogna-network
    command: pnpm run start:dev

  api-gateway:
    container_name: cogna-api-gateway
    build:
      context: ./cogna.backend
      dockerfile: ./api-gateway/Dockerfile
    environment:
      - AUTH_GRPC_URL=auth-service:50051
      - JWT_SECRET=top-secret
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_EXPIRES_IN=30d
    ports:
      - "4000:4000"
    networks:
      - cogna-network
    depends_on:
      - auth-service
  
  auth-service:
    container_name: cogna-auth-service
    build:
      context: ./cogna.backend
      dockerfile: ./auth-service/Dockerfile
    ports:
      - 50051:50051
    environment:
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URL=postgresql://cogna:cogna_dev_password@postgres:5432/auth_db
      - JWT_SECRET=top-secret
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_EXPIRES_IN=30d
    networks:
      - cogna-network
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
  
  notification-service:
    container_name: cogna-notification-service
    build:
      context: ./cogna.backend
      dockerfile: ./notification-service/Dockerfile
    environment:
      - SMTP_USER=sergey.volro.85@gmail.com
      - SMTP_PASS=gvqupuknpccotndl
      - SMTP_PORT=465
      - SMTP_HOST=smtp.gmail.com
      - SMTP_SECURE=true
      - KAFKA_BROKERS=kafka:9092
    networks:
      - cogna-network
    depends_on:
      - kafka
    restart: on-failure

  frontend:
    container_name: cogna-frontend
    build:
      context: ./cogna.training
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./cogna.training:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://dev.cogna.ru/api
    networks:
      - cogna-network
    command: pnpm run dev -- --host 0.0.0.0

  # pgAdmin - веб-интерфейс для PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cogna-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cogna.ru
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cogna-network
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: cogna-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - pgadmin
    networks:
      - cogna-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: cogna-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092, EXTERNAL://0.0.0.0:9093, CONTROLLER://0.0.0.0:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT, EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092, EXTERNAL://localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - cogna-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cogna-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cogna
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - cogna-network

  redis:
    image: redis:7-alpine
    container_name: cogna-redis
    ports:
      - "6379:6379"
    networks:
      - cogna-network

networks:
  cogna-network:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:
  pgadmin_data:

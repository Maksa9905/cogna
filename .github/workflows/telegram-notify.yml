# Уведомления в Telegram при падении CI.
# Настройка: создайте бота через @BotFather, добавьте его в чат/группу,
# затем в Settings → Secrets → Actions добавьте:
#   TELEGRAM_BOT_TOKEN — токен от BotFather
#   TELEGRAM_CHAT_ID — ID чата (можно узнать через @userinfobot или @getidsbot)
name: Telegram Notify

on:
  workflow_run:
    workflows:
      - "Training CI"
      - "Backend CI"
      - "E2E Tests"
    types: [completed]
    branches: [main, master]

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Отправка уведомления в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID не заданы — пропуск уведомления"
            exit 0
          fi

          WORKFLOW="${{ github.event.workflow_run.name }}"
          RUN_URL="${{ github.event.workflow_run.html_url }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          COMMIT="${{ github.event.workflow_run.head_sha }}"
          COMMIT_SHORT=$(echo "$COMMIT" | cut -c1-7)

          # Экранирование для JSON
          MSG=$(cat << EOF
          🔴 <b>CI упал: ${WORKFLOW}</b>

          📦 Репозиторий: ${REPO}
          🌿 Ветка: ${BRANCH}
          📌 Коммит: ${COMMIT_SHORT}

          🔗 <a href="${RUN_URL}">Открыть пайплайн</a>
          EOF
          )

          # Отправка через Telegram Bot API (HTML)
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            -d text="${MSG}"

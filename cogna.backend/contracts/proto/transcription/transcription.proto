syntax = 'proto3';

package transcription.v1;

service TranscriptionService {
  rpc TranscribeChunk(stream TranscriptionRequest) returns (TranscriptionResponse);
}

message TranscriptionRequest {
  bytes audio_content = 1;
  string attempt_id = 2;
  int32 chunk_index = 3;
  bool is_last = 4;
}

message TranscriptionResponse {
  string attempt_id = 1;
  int32 chunk_index = 2;
  string text = 3;
  bool is_final = 4;
}
syntax = "proto3";

package auth.v1;

service AuthService {
  rpc Register(RegisterRequest) returns (SuccessResponse);
  rpc ConfirmRegister(ConfirmRegisterRequest) returns (JwtResponse);
  rpc Login(LoginRequest) returns (JwtResponse);
  rpc Logout(JwtPayload) returns(SuccessResponse);
  rpc RefreshTokens(JwtPayload) returns(JwtResponse);
  rpc ValidateToken(JwtPayload) returns (SuccessResponse);
}

// Jwt
message JwtPayload {
  string sub = 1;
  string refreshTokenId = 2;
}

message JwtResponse {
  string accessToken = 1;
  string refreshToken = 2;
}

enum UserRole {
  USER = 0;
  ADMIN = 1;
}

// Success
message SuccessResponse {
  bool ok = 1;
}

// Register
message RegisterRequest {
  string email = 1;
  string password = 2;
}

// Confirm register
message ConfirmRegisterRequest {
  string email = 1;
  int32 otp = 2;
}


// Login
message LoginRequest {
  string email = 1;
  string password = 2;
}


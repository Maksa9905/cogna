syntax = "proto3";

package study.ticket.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service StudyTicketService {
  rpc TicketAttempt(TicketAttemptRequest) returns (google.protobuf.Empty);
}

// Kafka. Assessment-service -> Study-service
//Ticket Attempt
message TicketAttemptRequest {
  string ticketId = 1;
  string userId = 2;
  string subjectId = 3;
  int64 score = 4;
  repeated ThesisAssessment theses = 5;
  string summary = 6;
}

message ThesisAssessment {
  string thesis = 1;
  string assessment = 2;
}

message TicketAttempt {
  string id = 1;
  string ticket_id = 2;
  string user_id = 3;
  string subject_id = 4;
  float score = 5;
  string summary = 6;
  repeated ThesisAssessment theses = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message TicketProgress {
  string id = 1;
  string ticket_id = 2;
  string user_id = 3;
  string subject_id = 4;
  int32 total_count = 5;
  float best_score = 6;
  float last_score = 7;
  float average_score = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}


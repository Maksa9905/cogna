syntax = "proto3";

package study.ticket.v1;

import "google/protobuf/empty.proto";

service StudyTicketService {
  rpc TicketAttempt(TicketAttemptRequest) returns (google.protobuf.Empty);
}

// Kafka. Assessment-service -> Study-service
message TicketAttemptRequest {
  string ticketId = 1;
  string userId = 2;
  string subjectId = 3;
  int64 score = 4;
  repeated ThesisAssessment theses = 5;
  string summary = 6;
}

message ThesisAssessment {
  string thesis = 1;
  string assessment = 2;
}

syntax = "proto3";


package assessment.v1;

service AssessmentService {
  rpc ProcessTranscription(ProcessRequest) returns (ProcessResponse);
}

message ProcessRequest {
  string answer = 1;
  string user_id = 2;
  string ticket_id = 3;
}

message ProcessResponse {
  bool success = 1;
}

message AssessmentCompletedResponse {
  string ticketId = 1;
  string userId = 2;
  string subjectId = 3;
  int64 score = 4;
  repeated ThesisAssessment theses = 5;
  string summary = 6;
}

message ThesisAssessment {
  string thesis = 1;
  string assessment = 2;
}
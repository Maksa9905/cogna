syntax = "proto3";

package events.assessment.v1;

// Topic: assessment.process
// Producer: api-gateway -> Consumer: ai-service
message AssessmentProcessEvent {
  string answer = 1;
  string user_id = 2;
  string ticket_id = 3;
}

message ThesisAssessment {
  string thesis = 1;
  string assessment = 2;
}

// Topic: assessment.completed
// Producer: ai-service -> Consumer: api-gateway
message AssessmentCompletedEvent {
  string ticket_id = 1;
  string user_id = 2;
  string subject_id = 3;
  int64 score = 4;
  repeated ThesisAssessment theses = 5;
  string summary = 6;
}

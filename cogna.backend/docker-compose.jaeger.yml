# Запуск: из каталога cogna.backend: docker compose -f docker-compose.jaeger.yml up -d
# UI: http://localhost:16686
# OTLP HTTP → api-gateway: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://127.0.0.1:4318/v1/traces
# Если api-gateway в той же docker-сети, hostname: http://jaeger:4318/v1/traces
services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
